name: Validate CodyNick installers
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml php-cli php-mysql php-zip mariadb-server python3-venv acl
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n bootstrap/codynick-setup.sh
          bash -n bootstrap/codynick-apps.sh
          bash -n setup.sh
          bash -n setup-standard.sh
      - name: ANSI terminal regression
        run: node tests/test_ansi.cjs
      - name: Dashboard graph regression
        run: node tests/test_dashboard_graph.cjs
      - name: Blockly mixed-target generator regression
        run: node tests/block_generator.cjs
      - name: Dashboard PHP/MySQL and native Python integration
        env:
          MYSQL_TEST_USER: dashboard_test
          MYSQL_TEST_PASSWORD: dashboard-test-local
        run: |
          sudo systemctl start mariadb
          sudo mariadb -e "CREATE DATABASE IF NOT EXISTS dashboard_upgrade_test; CREATE USER IF NOT EXISTS 'dashboard_test'@'127.0.0.1' IDENTIFIED BY 'dashboard-test-local'; GRANT ALL ON dashboard_upgrade_test.* TO 'dashboard_test'@'127.0.0.1';"
          python3 -m venv /tmp/dashboard-tests
          /tmp/dashboard-tests/bin/pip install mysql-connector-python==26.10.0
          /tmp/dashboard-tests/bin/python tests/dashboard_integration.py
      - name: Real web-user permission regression
        run: |
          sudo groupadd --force codynick-media
          sudo /usr/bin/python3 -m unittest discover -s tests -p test_web_permissions.py -v
      - name: PHP syntax
        run: find components/ide -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Pinned helper checksum
        run: |
          expected=$(sed -n 's/^HELPER_SHA256="\([a-f0-9]*\)"/\1/p' bootstrap/codynick-setup.sh)
          printf '%s  bootstrap/network_setup.py\n' "$expected" | sha256sum -c -

      - name: Presenter panel browser regression
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
          node tests/second_guide_browser.cjs
      - name: Advanced IDE browser regression
        env:
          MYSQL_TEST_USER: dashboard_test
          MYSQL_TEST_PASSWORD: dashboard-test-local
        run: /tmp/dashboard-tests/bin/python tests/block_spaces_browser.py --advanced
